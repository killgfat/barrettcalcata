[project]
name = "barrettcalcata"
version = "1.0.0"
description = "Cloudflare Workers IOL calculator with Barrett Universal II formula and AI vision recognition for IOL Master reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "webtypy>=0.1.7",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]
